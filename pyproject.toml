[build-system]
requires = ["setuptools>=75.8.2", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "roundwire"
version = "0.5.0"
description = "Counter-Strike 2 match/round analytics with per-player stats, roles, and Rating 3.0"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Caio Moreira"}]
keywords = ["cs2", "counter-strike-2", "esports", "analytics", "mr12"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.0.0"]

[project.scripts]
roundwire = "roundwire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roundwire = ["py.typed", "catalog/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
